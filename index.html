<script>
(()=>{
"use strict";
const db=JSON.parse(document.getElementById('db').textContent);
const $=id=>document.getElementById(id);
const byId=new Map(db.units.map(u=>[u.object_id,u]));
let selected=db.units.find(x=>x.native_id==='builder')?.object_id||db.units[0].object_id;
$('num-tech').textContent=db.tech.length;
$('num-transform').textContent=db.transform.length;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function link(id,fallback){let o=byId.get(id);return o?'<button class="link" type="button" data-id="'+esc(id)+'">'+esc(o.name_zh)+' · '+esc(o.native_id)+'</button>':esc(fallback||id)}
function bind(root){root.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)))}
function drawList(){
const needle=$('find').value.trim().toLowerCase(),cat=$('category').value,prio=$('prio').value;
const matches=db.units.filter(o=>(!needle||[o.name_zh,o.native_id,o.object_id].some(v=>v.toLowerCase().includes(needle)))&&(!cat||o.category===cat)&&(!prio||o.priority===prio));
$('count').textContent=matches.length+' / '+db.units.length;
$('list').innerHTML=matches.map(o=>'<button type="button" class="unit '+(o.object_id===selected?'active':'')+'" data-id="'+esc(o.object_id)+'"><span><b>'+esc(o.name_zh)+'</b><small>'+esc(o.native_id)+' · '+esc(o.object_id)+'</small></span><span class="pill '+o.priority.toLowerCase()+'">'+esc(o.priority)+'</span></button>').join('')||'<p>没有匹配结果。</p>';
bind($('list'));
}
function showEdges(rows,outbound) {
return rows.length?rows.map(r=>'<div class="row"><div class="type">'+esc(r.relation)+'　'+esc(r.source_state?.split('-').slice(-1)[0])+' → '+esc(r.target_state?.split('-').slice(-1)[0])+'</div>'+link(outbound?r.target_id:r.source_id,outbound?r.target_name:r.source_name)+'<small>动作：'+esc(r.native_action)+'　费用：'+(r.cost_credits===''?'未记录':esc(r.cost_credits)+'$')+'</small><small>'+esc(r.relation_id)+' · '+esc(r.evidence_level)+'</small></div>').join(''):'<p class="muted">当前公开范围无对应关系。</p>'
}
function select(id) {
if(!byId.has(id))return;selected=id;drawList();drawDetails();
}
function drawDetails(){
const o=byId.get(selected);
const tin=db.tech.filter(x=>x.target_id===selected),tout=db.tech.filter(x=>x.source_id===selected);
const cin=db.transform.filter(x=>x.target_id===selected),cout=db.transform.filter(x=>x.source_id===selected);
$('detail').innerHTML='<h2>'+esc(o.name_zh)+' <span class="pill '+o.priority.toLowerCase()+'">'+esc(o.priority)+'</span></h2>'
+'<div class="muted"><code>'+esc(o.native_id)+'</code> · '+esc(o.object_id)+' · '+esc(o.category)+' · '+esc(o.scope)+'</div>'
+'<div class="facts" style="margin-top:15px"><span class="tag">已记录获取费用：'+(o.known_acquisition_prices?esc(o.known_acquisition_prices)+'$':'未列出')+'</span><span class="tag">'+esc(o.identity_status)+'</span></div>'
+'<p class="muted">价格受来源与科技状态影响。空白并非零元。</p>'
+'<div class="cards"><div><h3>从哪里获得（'+tin.length+'）</h3>'+showEdges(tin,false)+'</div><div><h3>能够生产／建造／升级什么（'+tout.length+'）</h3>'+showEdges(tout,true)+'</div></div>'
+'<h3>相关形态、模式与自动转换（'+(cin.length+cout.length)+'）</h3><div class="cards"><div>'+showEdges(cin,false)+'</div><div>'+showEdges(cout,true)+'</div></div>';
bind($('detail'));
}
['find','category','prio'].forEach(id=>$(id).addEventListener(id==='find'?'input':'change',drawList));
drawList();drawDetails();
})();
</script></body></html>
